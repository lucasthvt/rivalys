<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="Rivalys">
  <!-- Le concurrent : le niveau a rejoindre. -->
  <rect x="14" y="3.5" width="6" height="17" rx="1.8" fill="#A394FF" opacity=".42"/>
  <!-- Toi : le terrain tenu. -->
  <rect x="4" y="11.5" width="6" height="9" rx="1.8" fill="#A394FF"/>
  <!--
    L'ecart. Trait et tirets recalcules pour l'export : le perimetre du rect
    arrondi vaut 17,197 unites, donc une periode de 2,87 (1,61 + 1,26) y loge
    exactement 6 tirets et le motif boucle sans raccord. A 0,9 d'epaisseur le
    contour reste lisible jusqu'a 160 px, la ou 1,5 disloquait la forme en
    blocs epars.
  -->
  <rect x="4.75" y="4.25" width="4.5" height="5" rx="1.05" stroke="#A394FF" stroke-width="0.9"
        stroke-dasharray="1.61 1.26" stroke-dashoffset="0.8" opacity=".85"/>
</svg>
