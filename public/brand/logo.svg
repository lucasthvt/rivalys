<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 24" fill="none" role="img" aria-label="Rivalys">
  <rect x="14" y="3.5" width="6" height="17" rx="1.8" fill="#A394FF" opacity=".42"/>
  <rect x="4" y="11.5" width="6" height="9" rx="1.8" fill="#A394FF"/>
  <rect x="4.75" y="4.25" width="4.5" height="5" rx="1.05" stroke="#A394FF" stroke-width="0.9"
        stroke-dasharray="1.61 1.26" stroke-dashoffset="0.8" opacity=".85"/>
  <!--
    Le nom en <text> : hors de l'app, Golos Text n'est pas chargee et le rendu
    retombe sur la pile systeme. Pour tout affichage dans le produit, preferer
    le composant <Logo /> de src/components/brand/Logo.tsx, qui utilise la
    vraie fonte de marque.
  -->
  <text x="28" y="17" fill="#FAFAFA" font-family="'Golos Text', ui-sans-serif, system-ui, sans-serif"
        font-size="16" font-weight="600" letter-spacing="-0.4">Rivalys</text>
</svg>
